events {}

http {
  # Customers upload scanned documents (NID, trade license…), often 2-5 MB. The default 1 MB limit
  # made nginx answer 413 before the request ever reached the API.
  client_max_body_size 12m;

  # Use Docker's internal DNS resolver; cache for 5s so container restarts
  # resolve quickly without restarting nginx.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 80;

    location /api/ {
      set $backend http://backend:8000;
      # proxy_pass to a variable disables nginx's normal location-prefix
      # stripping, so /api/ would otherwise be forwarded to the backend
      # verbatim (which only serves /v1/...). Strip it explicitly.
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      set $frontend http://main-app:5173;
      proxy_pass $frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }
  }
}
