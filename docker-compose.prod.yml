name: leadbangla

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
  image: leadbangla-backend:prod
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/marketing_manager
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: marketing_manager
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketing_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  main-app:
    build:
      context: ./frontend/main-app
      dockerfile: Dockerfile.prod
    restart: unless-stopped

  admin-panel:
    build:
      context: ./frontend/admin-panel
      dockerfile: Dockerfile.prod
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - main-app
      - admin-panel
    ports:
      - "127.0.0.1:8020:80"

volumes:
  postgres-data:
  redis-data:
