[project]
name = "leadbangla-backend"
version = "0.1.0"
description = "LeadBangla backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "greenlet>=3.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "celery>=5.4",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0.1,<4.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pywebpush>=2.0.0",
    "boto3>=1.34",
    "dnspython>=2.6",
    "dkimpy>=1.1.5",
    "nh3>=0.2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
