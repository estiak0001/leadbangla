events {}

http {
  client_max_body_size 12m;
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Customer app + API
  server {
    listen 80 default_server;
    server_name leadbangla.com www.leadbangla.com;

    location /api/ {
      set $backend http://backend:8000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /admin/ {
      set $adminapp http://admin-panel:80;
      proxy_pass $adminapp;
      proxy_set_header Host $host;
    }
    location / {
      set $frontend http://main-app:80;
      proxy_pass $frontend;
      proxy_set_header Host $host;
    }
  }

  # Staff admin panel + API
  server {
    listen 80;
    server_name admin.leadbangla.com;

    location /api/ {
      set $backend http://backend:8000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location / {
      set $frontend http://admin-panel:80;
      proxy_pass $frontend;
      proxy_set_header Host $host;
    }
  }
}
